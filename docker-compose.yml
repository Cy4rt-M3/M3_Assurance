services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assurance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assurance}
      POSTGRES_DB: ${POSTGRES_DB:-assurance}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-assurance} -d ${POSTGRES_DB:-assurance}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  evidence-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-assurance}:${POSTGRES_PASSWORD:-assurance}@postgres:5432/${POSTGRES_DB:-assurance}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "10002:10002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:10002/health')); raise SystemExit(0 if d.get('db') and d.get('redis') else 1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ../Dashboard-frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_EVIDENCE_AGGREGATOR_URL: http://localhost:10002
    ports:
      - "3000:3000"
    depends_on:
      evidence-aggregator:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
