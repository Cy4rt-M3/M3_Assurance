services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-assurance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assurance}
      POSTGRES_DB: ${POSTGRES_DB:-assurance}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-assurance} -d ${POSTGRES_DB:-assurance}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine

    ports:
      - "${REDIS_PORT:-6380}:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgresql+asyncpg://assurance:assurance@postgres:5432/assurance

    command:
      [
        "uv",
        "run",
        "alembic",
        "upgrade",
        "head"
      ]

    depends_on:
      postgres:
        condition: service_healthy

  db-seed:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgresql+asyncpg://assurance:assurance@postgres:5432/assurance

    command:
      [
        "uv",
        "run",
        "python",
        "docker/seed/seed.py"
      ]

    depends_on:
      db-migrate:
        condition: service_completed_successfully

  evidence-aggregator:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "10002:10002"

    environment:
      DATABASE_URL: postgresql+asyncpg://assurance:assurance@postgres:5432/assurance
      REDIS_URL: redis://redis:6379/0
      PORT_EVIDENCE_AGGREGATOR: 10002

    depends_on:
      db-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:10002/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  dashboard:
    build:
      context: ../Dashboard-frontend
      dockerfile: Dockerfile

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      EVIDENCE_AGGREGATOR_URL: http://evidence-aggregator:10002

    depends_on:
      evidence-aggregator:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data:
