[project]
name = "m3-assurance"
version = "0.1.0"
description = "CyArt M3 Assurance – Compliance, Evidence & Resilience Scoring Engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "weasyprint>=60.0",
    "httpx>=0.27.0",
    "pymongo>=4.18.0",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.0.0",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
    "vulture>=2.11",
    "bandit[toml]>=1.7.0",
    "detect-secrets>=1.4.0",
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "--cov=apps --cov-report=term-missing --cov-fail-under=100 -x"

[tool.coverage.run]
source = ["apps"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
exclude = [
    ".venv",
    "alembic",
    "master_setup.py",
    "guard-my-code.py"
]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C90", # mccabe (cyclomatic complexity)
]

[tool.ruff.lint.mccabe]
max-complexity = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.bandit]
exclude_dirs = [".venv", ".ruff_cache", "alembic"]
